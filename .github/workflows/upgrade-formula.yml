# ~~ Generated by projen. To modify, edit .projenrc.js and run "npx projen".

name: upgrade-formula
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      formulas:
        description: Comma separated list of formulas to update (e.g. jaw.rb,Casks/woof.rb). Leave empty to update all.
        required: false
        default: ""
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.PROJEN_APP_ID }}
          private-key: ${{ secrets.PROJEN_APP_PRIVATE_KEY }}
          contents: write
          pullRequests: write
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/setup@f7d0e5f4b1b3089d2799ef9722859e7ba314c4c8
        with:
          version: 12.2.1
          runtime: node@24.20.0
          cache: true
      - id: auto_8ece9c1e
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - name: Install dependencies
        id: install_dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm i --frozen-lockfile
      - name: Upgrade formulas
        id: upgrade_formulas
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        run: |-
          
          FORMULAS="${{ github.event.inputs.formulas }}"
          if [ -z "$FORMULAS" ]; then
            node scripts/update-formulas.js aws-credentials-switcher.rb jaw.rb pretty-logs.rb ssm-env.rb
          else
            node scripts/update-formulas.js $(echo $FORMULAS | tr ',' ' ')
          fi
      - name: Create Pull Request
        id: create_pull_request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "chore: upgrade homebrew formulas"
          title: "chore(upgrade): upgrade homebrew formulas"
          body: This PR upgrades the homebrew formulas to their latest versions.
          branch: chore/upgrade-formulas
